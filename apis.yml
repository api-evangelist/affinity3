aid: affinity3
name: Affinity Technology (The Lobby)
description: 'Affinity Technology, Inc. operates The Lobby (fromthelobby.com; app at tryaffinity.com),
  an invite-only creator-marketing marketplace connecting direct-to-consumer brands with content creators
  for product seeding, paid partnerships and user-generated content. Brands stock a Creator Closet that
  vetted creators request from, and the platform handles standardized one-click partnership offers, contracts,
  Shopify-driven fulfilment and shipment tracking, deliverable reminders, a content library and social-listening
  reporting. The company began as Affinity, an AI personalized-fashion recommendation service for brands
  and retailers (San Francisco, backed by 8VC, EquityZen ticker AFFI) and pivoted the same entity and
  domain to the creator-marketing product. It publishes NO developer program: no portal, no API reference,
  no OpenAPI/GraphQL/MCP surface, no api.* host, no public code org. Its only advertised integration is
  a Shopify connection configured inside the authenticated brand dashboard.'
